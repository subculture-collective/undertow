name: Reliability checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub Actions deploys main (.github/workflows/deploy.yml); Gitea keeps verification only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-latest, kvant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix server ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Audit API dependencies
        run: npm --prefix server audit --audit-level=high
      - run: npm run build
      - run: npm --prefix server run build
      - run: bash scripts/test-with-postgres.sh
