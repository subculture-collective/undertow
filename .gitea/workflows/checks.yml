name: Reliability checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: npm --prefix server run build
      - run: bash scripts/test-with-postgres.sh
