# Production stack for one host (proposed: Dozor, behind the Almaz edge).
# Limits keep Undertow from competing with monitoring on a shared host.
#   docker compose -f deploy/compose.yml --env-file deploy/undertow.env up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: undertow.env
    environment:
      DATABASE_URL: postgres://undertow:${POSTGRES_PASSWORD}@db:5432/undertow
    ports:
      - "127.0.0.1:8787:8787"   # the edge proxies to this; not exposed to the LAN directly
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: undertow
    volumes:
      - undertow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 10s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

volumes:
  undertow-db:
