# Production stack for one host (proposed: Dozor, behind the Almaz edge).
# Limits keep Undertow from competing with monitoring on a shared host.
#   docker compose -f deploy/compose.yml --env-file deploy/undertow.env up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: undertow.env
    environment:
      DATABASE_URL: postgres://undertow:${POSTGRES_PASSWORD}@db:5432/undertow
    ports:
      # The edge proxies to this. Loopback by default; set UNDERTOW_BIND (e.g. 10.0.0.57:3040) when the edge is another host.
      - "${UNDERTOW_BIND:-127.0.0.1:8787}:8787"
    volumes:
      - undertow-renders:/app/server/data/renders
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  # Cloud render worker: headless Chrome plus ffmpeg. One job at a time; capped so it can't starve the host.
  # Stateless, so it can move to another amd64 host that reaches the API (set API_URL/EDITOR_URL there).
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      API_URL: http://api:8787
      EDITOR_URL: http://api:8787
      WORKER_SECRET: ${WORKER_SECRET}
    depends_on:
      - api
    shm_size: 1g        # Chrome needs more shared memory than Docker's 64 MB default
    mem_limit: 2g
    cpus: 2.0

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: undertow
    volumes:
      - undertow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 10s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

volumes:
  undertow-db:
  undertow-renders:
